schema: spec-driven

context: |
  Shared, cross-cutting specifications for Cardigan.
  Every spec here applies to all three platforms: backend, mobile apps, and web frontend.
  Platform-specific behavior belongs in that platform's own spec store, never here.

rules:
  proposal:
    - Only propose a change here if it affects all three platforms; otherwise move it to the platform's own store
  specs:
    - Describe shared behavior and contracts only, with no platform-specific implementation details
