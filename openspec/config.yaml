schema: shared-specs-only

context: |
  Shared, cross-platform specifications for Cardigan (backend, mobile apps, web frontend).
  This store only holds shared specs and their delta specs. No design or implementation work happens here.
  Every change targets at least two platforms. Platform-specific behavior belongs in that platform's own store.

rules:
  proposal:
    - Keep it brief - only what changes and why, no implementation details
    - List the target platforms (at least two)
    - Flag breaking changes prominently when all platforms must migrate
  specs:
    - Describe shared behavior and contracts only, with no platform-specific implementation details
